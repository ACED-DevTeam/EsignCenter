# Recurring Sidekiq jobs (sidekiq-cron). This is sidekiq-cron's default
# schedule file: the gem's own startup hook loads it when a Sidekiq server
# boots (source "schedule", so a job deleted here is purged on deploy).
scheduler_heartbeat:
  cron: '* * * * *'
  class: 'SchedulerHeartbeatJob'
  queue: recurrent
  description: 'Writes the scheduler heartbeat that /up reports as scheduler_last_tick_at'

# Stripe is the source of truth for who is paying; webhooks are how we hear
# about it and webhooks get lost. Once a night we ask Stripe about every
# subscription we think we have and repair whatever drifted.
stripe_reconciliation:
  cron: '0 6 * * *'
  class: 'StripeReconciliationJob'
  queue: billing
  description: 'Re-reads every Stripe subscription, repairs drift and re-enqueues stuck webhook events'

# The billing clock: reminder emails through the 14-day grace period, the
# suspension at the end of it, and the seats of invitations nobody accepted
# (lib/billing_lifecycle.rb). Hourly, so the deadline lands within the hour
# rather than up to a day late.
billing_lifecycle:
  cron: '15 * * * *'
  class: 'BillingLifecycleJob'
  queue: billing
  description: 'Sends past-due reminders, suspends accounts whose 14-day grace period ran out, and releases the seats of expired invitations'

# The retention clock (D43): warning emails for accounts nobody has signed in
# to for nearly a year, the one-week reminder before a scheduled deletion, and
# the purges themselves. Daily rather than hourly — every deadline here is a
# date, not an hour — and early enough in the morning that a person is around
# if the operator alert fires.
account_retention:
  cron: '30 4 * * *'
  class: 'AccountRetentionJob'
  queue: default
  description: 'Sends dormant-account and scheduled-deletion warnings, and purges accounts whose date has passed'
