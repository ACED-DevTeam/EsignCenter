# Recurring Sidekiq jobs (sidekiq-cron). This is sidekiq-cron's default
# schedule file: the gem's own startup hook loads it when a Sidekiq server
# boots (source "schedule", so a job deleted here is purged on deploy).
scheduler_heartbeat:
  cron: '* * * * *'
  class: 'SchedulerHeartbeatJob'
  queue: recurrent
  description: 'Writes the scheduler heartbeat that /up reports as scheduler_last_tick_at'

# Stripe is the source of truth for who is paying; webhooks are how we hear
# about it and webhooks get lost. Once a night we ask Stripe about every
# subscription we think we have and repair whatever drifted.
stripe_reconciliation:
  cron: '0 6 * * *'
  class: 'StripeReconciliationJob'
  queue: billing
  description: 'Re-reads every Stripe subscription, repairs drift and re-enqueues stuck webhook events'

# The dunning clock: reminder emails through the 14-day grace period and the
# suspension at the end of it (lib/billing_lifecycle.rb). Hourly, so the
# deadline lands within the hour rather than up to a day late.
billing_dunning:
  cron: '15 * * * *'
  class: 'BillingDunningJob'
  queue: billing
  description: 'Sends past-due reminder emails and suspends accounts whose 14-day grace period has run out'
