      <p>בסימון התיבה, את/ה מסכים/ה להשתמש במסמך זה ברשומות אלקטרוניות ובחתימות אלקטרוניות במקום נייר ועט. את/ה מסכים/ה שלחתימה האלקטרונית שלך יש אותו תוקף משפטי כמו לחתימה בכתב ידך. עותק של המסמך שהושלם יהיה זמין לך באופן אלקטרוני, והשולח יכול גם לספק לך עותק לפי בקשה.</p>
      <p><strong>מה נדרש.</strong> דפדפן עדכני, חיבור לאינטרנט ותוכנה שיכולה לפתוח קובצי PDF. אם ניתן לקרוא דף זה, המכשיר שלך עומד בדרישות אלה.</p>
      <p><strong>ביטול ההסכמה.</strong> ניתן לבטל את ההסכמה בכל עת לפני השלמת המסמך, על ידי אי-חתימה עליו ויידוע השולח. ביטול ההסכמה אינו משפיע על מסמכים שכבר נחתמו.</p>
      <p><strong>עותקים מודפסים.</strong> ניתן לבקש עותק מודפס של מסמך זה בכל עת בפנייה לשולח.</p>
      <p><strong>מה אנחנו מתעדים.</strong> ההסכמה שלך נרשמת יחד עם התאריך, השעה וכתובת האינטרנט (IP) שממנה ניתנה, ומופיעה ביומן הביקורת של המסמך.</p>
