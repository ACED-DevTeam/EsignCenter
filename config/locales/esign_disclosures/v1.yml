# Superseded ESIGN disclosure texts, kept so a consent event recorded under an
# older version can still be read back word for word (docs/esign-consent.md §6).
# Never edit these strings: EsignConsent.disclosure_sha256 fingerprints them, and
# every v1 consent event on record carries that fingerprint.
#
# A version snapshot has TWO halves, because both are fingerprinted: the body
# (`<version>:`) and the three self-signing paragraphs a sender signing their
# own document was shown (`<version>_self_signing:`, keyed by the same names as
# the live locale keys). Archive them together — a body archived without its
# self-signing paragraphs leaves every self-signing consent of that version
# unreproducible, and the audit trail can then only say "wording no longer on
# file". A version that never had a self-signing variant says
# `never_published` instead, which is a fact on the record rather than an
# omission somebody has to guess at.
en:
  esign_disclosure_archive:
    v1: |-
      <p>By checking the box, you agree to use electronic records and electronic signatures for this document instead of paper and ink. You agree that your electronic signature has the same legal effect as your handwritten signature. A copy of the completed document will be available to you electronically, and the sender can also provide one on request.</p>
      <p><strong>What you need.</strong> A current web browser, an internet connection and software that can open PDF files. If you can read this page, your device meets these requirements.</p>
      <p><strong>Withdrawing consent.</strong> You may withdraw your consent at any time before you complete the document by not signing it and letting the sender know. Withdrawing consent does not affect documents you have already signed.</p>
      <p><strong>Paper copies.</strong> You may request a paper copy of this document at any time by contacting the sender.</p>
      <p><strong>What we record.</strong> Your agreement is recorded together with the date, time and internet (IP) address from which you gave it, and it appears in the document's audit trail.</p>
    # v1 shipped before the self-signing variant existed, so no v1 consent
    # can carry `self_signing`: there are no v1 paragraphs to reproduce, and
    # a v1 self-signing consent cannot exist (docs/esign-consent.md §6).
    v1_self_signing: never_published
