      <p>확인란을 선택하면 이 문서에 종이와 잉크 대신 전자 기록과 전자 서명을 사용하는 데 동의하게 됩니다. 귀하는 귀하의 전자 서명이 자필 서명과 동일한 법적 효력을 가진다는 데 동의합니다. 완료된 문서의 사본은 전자적으로 확인하실 수 있으며, 요청하시면 발신자가 사본을 제공해 드릴 수도 있습니다.</p>
      <p><strong>필요한 것.</strong> 최신 웹 브라우저, 인터넷 연결, PDF 파일을 열 수 있는 프로그램입니다. 이 페이지를 읽을 수 있다면 귀하의 기기는 이 요건을 충족합니다.</p>
      <p><strong>동의 철회.</strong> 문서를 완료하기 전에는 언제든지 서명하지 않고 발신자에게 알리는 방법으로 동의를 철회할 수 있습니다. 동의 철회는 이미 서명한 문서에는 영향을 미치지 않습니다.</p>
      <p><strong>종이 사본.</strong> 발신자에게 연락하여 언제든지 이 문서의 종이 사본을 요청할 수 있습니다.</p>
      <p><strong>기록되는 내용.</strong> 귀하의 동의는 동의한 날짜, 시간, 인터넷(IP) 주소와 함께 기록되며 문서의 감사 추적에 표시됩니다.</p>
