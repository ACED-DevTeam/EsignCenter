  esign_consent_disclosure_body_html: |-
    <p>Al marcar la casilla, acepta usar registros y firmas electrónicos para este documento en lugar de papel y tinta. Acepta que su firma electrónica tiene el mismo efecto legal que su firma manuscrita. Una copia del documento completado estará disponible para usted por medios electrónicos, y el remitente también puede facilitarle una si la solicita.</p>
    <p><strong>Lo que necesita.</strong> Un navegador web actual, conexión a internet y un programa que pueda abrir archivos PDF. Si puede leer esta página, su dispositivo cumple estos requisitos.</p>
    <p><strong>Retirar el consentimiento.</strong> Puede retirar su consentimiento en cualquier momento antes de completar el documento: basta con no firmarlo e informar al remitente. Retirar el consentimiento no afecta a los documentos que ya haya firmado.</p>
    <p><strong>Copias en papel.</strong> Puede solicitar una copia en papel de este documento en cualquier momento poniéndose en contacto con el remitente.</p>
    <p><strong>Lo que registramos.</strong> Su aceptación se registra junto con la fecha, la hora y la dirección de internet (IP) desde la que la otorgó, y aparece en el registro de auditoría del documento.</p>
