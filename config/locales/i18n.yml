  esign_consent_disclosure_body_html: |-
    <p>Zaškrtnutím políčka souhlasíte s tím, že pro tento dokument budou místo papíru a inkoustu použity elektronické dokumenty a elektronické podpisy. Souhlasíte s tím, že váš elektronický podpis má stejné právní účinky jako váš vlastnoruční podpis. Kopie dokončeného dokumentu vám bude k dispozici elektronicky a odesílatel vám ji může na požádání rovněž poskytnout.</p>
    <p><strong>Co potřebujete.</strong> Aktuální webový prohlížeč, připojení k internetu a program, který otevře soubory PDF. Pokud dokážete přečíst tuto stránku, vaše zařízení tyto požadavky splňuje.</p>
    <p><strong>Odvolání souhlasu.</strong> Souhlas můžete kdykoli před dokončením dokumentu odvolat tak, že dokument nepodepíšete a informujete odesílatele. Odvolání se netýká dokumentů, které jste již podepsali.</p>
    <p><strong>Papírové kopie.</strong> O papírovou kopii tohoto dokumentu můžete kdykoli požádat odesílatele.</p>
    <p><strong>Co zaznamenáváme.</strong> Váš souhlas je zaznamenán spolu s datem, časem a internetovou adresou (IP), ze které byl udělen, a je uveden v auditní stopě dokumentu.</p>
