  esign_consent_disclosure_body_html: |-
    <p>Установлюючи прапорець, ви погоджуєтеся використовувати для цього документа електронні документи та електронні підписи замість паперу й чорнила. Ви погоджуєтеся, що ваш електронний підпис має таку саму юридичну силу, як і ваш власноручний підпис. Копія завершеного документа буде доступна вам в електронному вигляді, а відправник також може надати її на ваш запит.</p>
    <p><strong>Що вам потрібно.</strong> Сучасний веббраузер, підключення до інтернету та програма, яка відкриває файли PDF. Якщо ви можете прочитати цю сторінку, ваш пристрій відповідає цим вимогам.</p>
    <p><strong>Відкликання згоди.</strong> Ви можете відкликати згоду в будь-який момент до завершення документа: просто не підписуйте його та повідомте відправника. Відкликання не стосується документів, які ви вже підписали.</p>
    <p><strong>Паперові копії.</strong> Ви можете будь-коли запросити паперову копію цього документа, звернувшись до відправника.</p>
    <p><strong>Що ми записуємо.</strong> Ваша згода фіксується разом із датою, часом та інтернет-адресою (IP), з якої її було надано, і відображається в журналі аудиту документа.</p>
