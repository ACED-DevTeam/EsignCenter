  esign_consent_disclosure_body_html: |-
    <p>Selezionando la casella, accetti di utilizzare documenti e firme elettronici per questo documento al posto di carta e inchiostro. Accetti che la tua firma elettronica abbia lo stesso effetto legale della tua firma autografa. Una copia del documento completato sarà disponibile per te in formato elettronico e il mittente può fornirtene una anche su richiesta.</p>
    <p><strong>Cosa ti serve.</strong> Un browser web aggiornato, una connessione a internet e un programma in grado di aprire file PDF. Se riesci a leggere questa pagina, il tuo dispositivo soddisfa questi requisiti.</p>
    <p><strong>Revoca del consenso.</strong> Puoi revocare il consenso in qualsiasi momento prima di completare il documento, semplicemente non firmandolo e informando il mittente. La revoca non riguarda i documenti che hai già firmato.</p>
    <p><strong>Copie cartacee.</strong> Puoi richiedere in qualsiasi momento una copia cartacea di questo documento contattando il mittente.</p>
    <p><strong>Cosa registriamo.</strong> Il tuo consenso viene registrato insieme a data, ora e indirizzo internet (IP) da cui è stato prestato, e compare nel registro di audit del documento.</p>
