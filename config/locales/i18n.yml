  esign_consent_disclosure_body_html: |-
    <p>Zaznaczając pole, zgadzasz się na korzystanie z dokumentów i podpisów elektronicznych w odniesieniu do tego dokumentu zamiast papieru i długopisu. Zgadzasz się, że Twój podpis elektroniczny ma taki sam skutek prawny jak Twój podpis odręczny. Kopia gotowego dokumentu będzie dla Ciebie dostępna drogą elektroniczną, a nadawca może również przekazać Ci ją na życzenie.</p>
    <p><strong>Czego potrzebujesz.</strong> Aktualnej przeglądarki internetowej, połączenia z internetem oraz programu otwierającego pliki PDF. Jeśli możesz przeczytać tę stronę, Twoje urządzenie spełnia te wymagania.</p>
    <p><strong>Wycofanie zgody.</strong> Możesz wycofać zgodę w dowolnym momencie przed ukończeniem dokumentu – wystarczy go nie podpisywać i poinformować nadawcę. Wycofanie zgody nie dotyczy dokumentów, które już zostały podpisane.</p>
    <p><strong>Kopie papierowe.</strong> W każdej chwili możesz poprosić o papierową kopię tego dokumentu, kontaktując się z nadawcą.</p>
    <p><strong>Co rejestrujemy.</strong> Twoja zgoda jest zapisywana wraz z datą, godziną i adresem internetowym (IP), z którego została udzielona, i pojawia się w dzienniku audytu dokumentu.</p>
