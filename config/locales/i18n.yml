  esign_consent_disclosure_body_html: |-
    <p>Mit dem Setzen des Häkchens stimmen Sie zu, für dieses Dokument elektronische Dokumente und elektronische Signaturen anstelle von Papier und Tinte zu verwenden. Sie stimmen zu, dass Ihre elektronische Signatur dieselbe rechtliche Wirkung hat wie Ihre handschriftliche Unterschrift. Eine Kopie des fertigen Dokuments steht Ihnen elektronisch zur Verfügung, und der Absender kann Ihnen auf Anfrage ebenfalls eine bereitstellen.</p>
    <p><strong>Was Sie benötigen.</strong> Einen aktuellen Webbrowser, eine Internetverbindung und ein Programm, das PDF-Dateien öffnen kann. Wenn Sie diese Seite lesen können, erfüllt Ihr Gerät diese Anforderungen.</p>
    <p><strong>Widerruf der Zustimmung.</strong> Sie können Ihre Zustimmung jederzeit vor dem Abschluss des Dokuments widerrufen, indem Sie es nicht unterschreiben und den Absender informieren. Der Widerruf betrifft keine Dokumente, die Sie bereits unterschrieben haben.</p>
    <p><strong>Papierkopien.</strong> Sie können jederzeit eine Papierkopie dieses Dokuments anfordern, indem Sie sich an den Absender wenden.</p>
    <p><strong>Was wir aufzeichnen.</strong> Ihre Zustimmung wird zusammen mit Datum, Uhrzeit und der Internetadresse (IP) aufgezeichnet, von der aus Sie sie erteilt haben, und erscheint im Prüfprotokoll des Dokuments.</p>
