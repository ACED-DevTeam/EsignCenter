  esign_consent_disclosure_body_html: |-
    <p>Ao marcar a caixa, concorda em utilizar registos e assinaturas eletrónicos para este documento, em vez de papel e tinta. Concorda que a sua assinatura eletrónica tem o mesmo efeito legal que a sua assinatura manuscrita. Uma cópia do documento concluído ficará disponível para si por via eletrónica, e o remetente também pode fornecer-lhe uma a pedido.</p>
    <p><strong>O que precisa.</strong> Um navegador web atual, uma ligação à internet e um programa capaz de abrir ficheiros PDF. Se consegue ler esta página, o seu dispositivo cumpre estes requisitos.</p>
    <p><strong>Retirar o consentimento.</strong> Pode retirar o seu consentimento a qualquer momento antes de concluir o documento, bastando não o assinar e informar o remetente. A retirada não afeta os documentos que já assinou.</p>
    <p><strong>Cópias em papel.</strong> Pode solicitar a qualquer momento uma cópia em papel deste documento contactando o remetente.</p>
    <p><strong>O que registamos.</strong> O seu consentimento é registado juntamente com a data, a hora e o endereço de internet (IP) a partir do qual foi dado, e consta do registo de auditoria do documento.</p>
