  esign_consent_disclosure_body_html: |-
    <p>Door het vakje aan te vinken gaat u ermee akkoord om voor dit document elektronische documenten en elektronische handtekeningen te gebruiken in plaats van papier en pen. U gaat ermee akkoord dat uw elektronische handtekening dezelfde rechtsgeldigheid heeft als uw handgeschreven handtekening. Een kopie van het voltooide document is elektronisch voor u beschikbaar, en de afzender kan u er op verzoek ook een verstrekken.</p>
    <p><strong>Wat u nodig heeft.</strong> Een actuele webbrowser, een internetverbinding en software waarmee u PDF-bestanden kunt openen. Als u deze pagina kunt lezen, voldoet uw apparaat aan deze eisen.</p>
    <p><strong>Toestemming intrekken.</strong> U kunt uw toestemming op elk moment vóór het voltooien van het document intrekken door het niet te ondertekenen en de afzender hiervan op de hoogte te stellen. Intrekken heeft geen gevolgen voor documenten die u al heeft ondertekend.</p>
    <p><strong>Papieren kopieën.</strong> U kunt op elk moment een papieren kopie van dit document aanvragen door contact op te nemen met de afzender.</p>
    <p><strong>Wat wij vastleggen.</strong> Uw akkoord wordt vastgelegd samen met de datum, het tijdstip en het internetadres (IP) van waaruit u het heeft gegeven, en verschijnt in het audittrail van het document.</p>
