  esign_consent_disclosure_body_html: |-
    <p>チェックボックスをオンにすると、この文書について紙とインクの代わりに電子記録および電子署名を使用することに同意したことになります。お客様は、お客様の電子署名が手書きの署名と同じ法的効力を持つことに同意します。完成した文書の写しは電子的にご利用いただけるほか、ご要望に応じて送信者から提供を受けることもできます。</p>
    <p><strong>必要なもの。</strong> 最新のウェブブラウザ、インターネット接続、PDFファイルを開けるソフトウェアです。このページを読めていれば、お使いの端末はこれらの要件を満たしています。</p>
    <p><strong>同意の撤回。</strong> 文書を完了する前であれば、署名せずに送信者に連絡することで、いつでも同意を撤回できます。同意の撤回は、すでに署名した文書には影響しません。</p>
    <p><strong>紙のコピー。</strong> 送信者に連絡すれば、いつでもこの文書の紙のコピーを請求できます。</p>
    <p><strong>記録される内容。</strong> お客様の同意は、同意した日時およびインターネット（IP）アドレスとともに記録され、文書の監査証跡に表示されます。</p>
