  esign_consent_disclosure_body_html: |-
    <p>En cochant la case, vous acceptez d'utiliser des documents et des signatures électroniques pour ce document, à la place du papier et de l'encre. Vous acceptez que votre signature électronique ait le même effet juridique que votre signature manuscrite. Une copie du document finalisé sera à votre disposition par voie électronique, et l'expéditeur peut également vous en fournir une sur demande.</p>
    <p><strong>Ce dont vous avez besoin.</strong> Un navigateur web récent, une connexion internet et un logiciel capable d'ouvrir les fichiers PDF. Si vous pouvez lire cette page, votre appareil répond à ces exigences.</p>
    <p><strong>Retrait du consentement.</strong> Vous pouvez retirer votre consentement à tout moment avant de finaliser le document, en ne le signant pas et en prévenant l'expéditeur. Le retrait n'affecte pas les documents que vous avez déjà signés.</p>
    <p><strong>Copies papier.</strong> Vous pouvez demander à tout moment une copie papier de ce document en contactant l'expéditeur.</p>
    <p><strong>Ce que nous enregistrons.</strong> Votre accord est enregistré avec la date, l'heure et l'adresse internet (IP) depuis laquelle vous l'avez donné, et il figure dans la piste d'audit du document.</p>
