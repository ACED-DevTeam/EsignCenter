  esign_consent_disclosure_body_html: |-
    <p>بتحديد المربع، فإنك توافق على استخدام السجلات الإلكترونية والتوقيعات الإلكترونية لهذا المستند بدلاً من الورق والحبر. وتوافق على أن لتوقيعك الإلكتروني الأثر القانوني نفسه الذي لتوقيعك بخط اليد. ستكون نسخة من المستند المكتمل متاحة لك إلكترونيًا، ويمكن للمرسل أيضًا تزويدك بنسخة عند الطلب.</p>
    <p><strong>ما تحتاج إليه.</strong> متصفح ويب حديث، واتصال بالإنترنت، وبرنامج يمكنه فتح ملفات PDF. إذا كان بإمكانك قراءة هذه الصفحة، فإن جهازك يستوفي هذه المتطلبات.</p>
    <p><strong>سحب الموافقة.</strong> يمكنك سحب موافقتك في أي وقت قبل إكمال المستند بعدم توقيعه وإبلاغ المرسل. لا يؤثر سحب الموافقة على المستندات التي وقعتها بالفعل.</p>
    <p><strong>النسخ الورقية.</strong> يمكنك طلب نسخة ورقية من هذا المستند في أي وقت عبر التواصل مع المرسل.</p>
    <p><strong>ما نسجله.</strong> يتم تسجيل موافقتك مع التاريخ والوقت وعنوان الإنترنت (IP) الذي منحتها منه، وتظهر في سجل التدقيق الخاص بالمستند.</p>
