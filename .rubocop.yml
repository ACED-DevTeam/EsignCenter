plugins:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: enable
  Exclude:
    - db/schema.rb
    - node_modules/**/*
    - bin/*
    - vendor/**/*
  TargetRubyVersion: '4.0'
  SuggestExtensions: false

Metrics/BlockLength:
  Exclude:
    - Rakefile
    - '**/*.rake'
    - spec/**/*
    - config/environments/**/*
    - config/routes.rb

Style/Documentation:
  Enabled: false

Lint/MissingSuper:
  Enabled: false

Metrics/ParameterLists:
  Max: 12

Metrics/MethodLength:
  Max: 30
  Exclude:
    - 'db/migrate/**'
    - 'spec/**/*'

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

Style/MultipleComparison:
  Enabled: false

Style/NumericPredicate:
  Enabled: false

Style/MinMaxComparison:
  Enabled: false

Style/EmptyClassDefinition:
  Enabled: false

Style/OneClassPerFile:
  Enabled: false

Layout/MultilineMethodCallIndentation:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

Layout/LineLength:
  AllowedPatterns: ['\A\s*#']

Metrics/AbcSize:
  Max: 45
  Exclude:
    - spec/**/*

Metrics/ModuleLength:
  Max: 1000

Metrics/ClassLength:
  Max: 1000

RSpec/NestedGroups:
  Max: 6

RSpec/MultipleExpectations:
  Max: 25

RSpec/ExampleLength:
  Max: 500

RSpec/MultipleMemoizedHelpers:
  Max: 15

RSpec/AnyInstance:
  Enabled: false

Metrics/BlockNesting:
  Max: 6

Rails/I18nLocaleTexts:
  Enabled: false

Rails/FindEach:
  Enabled: false

Rails/SkipsModelValidations:
  Enabled: false

Rails/ApplicationController:
  Enabled: false

Rails/Output:
  Enabled: false

Rails/StrongParametersExpect:
  Enabled: false

Rails/RedirectBackOrTo:
  Enabled: false

# AccountInvite.find_by_token is a real class method (it hashes the raw token
# and looks the digest up), not ActiveRecord's dynamic finder for a `token`
# column — there is no such column.
Rails/DynamicFindBy:
  AllowedMethods:
    - find_by_token

Rails/UnknownEnv:
  Environments:
    - development
    - test
    - production
    - local

# Rails/BulkChangeTable reads the adapter out of config/database.yml, which
# only resolves when a DATABASE_URL is present — so the cop was silent in CI
# and loud on any machine that happened to export one, which is how fourteen
# "new" offences appeared in migrations nobody had touched. Pin the adapter so
# the gate answers the same everywhere, and exclude the migrations written
# before the pin: they have run in production, they are never edited again,
# and rewriting shipped history to please a style cop would be the riskier
# change. Anything added from here on has to combine its alters.
Rails/BulkChangeTable:
  Database: postgresql
  Exclude:
    - db/migrate/20230726062428_add_template_fields_to_submission.rb
    - db/migrate/20230819113427_remove_user_first_last_name_not_null.rb
    - db/migrate/20230902171216_add_phone_and_name_to_submitters.rb
    - db/migrate/20230915200635_add_devise_two_factor_to_users.rb
    - db/migrate/20250523121121_add_shared_link_to_templates.rb
    - db/migrate/20250912090605_add_template_variables.rb
    - db/migrate/20251125194305_add_confirmable_to_users.rb
    - db/migrate/20260224120000_add_pkce_to_doorkeeper_access_grants.rb
    - db/migrate/20260902120300_add_sending_pause_to_accounts.rb
    - db/migrate/20260903000200_add_stripe_state_to_account_subscriptions.rb
    - db/migrate/20260903030000_add_suspension_to_accounts.rb
    - db/migrate/20260904060000_add_payment_pending_to_account_invites.rb
    - db/migrate/20260905100100_add_paid_thresholds_to_account_limit_overrides.rb
