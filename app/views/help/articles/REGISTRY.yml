# Help-centre article registry. The order below is the order of the articles
# within each section on /help; the prose for each slug lives beside this file
# at app/views/help/articles/<slug>.html.erb.
#
# summary is the card blurb (<= 140 characters). Deliberately free of product
# numbers: a number belongs in the article body, rendered from its constant.
# reading_minutes is the body word count at roughly 200 words a minute.
#
# Articles of the same section must sit TOGETHER. The index groups by section
# and the prev/next chain at the foot of an article walks that grouping, so an
# entry parked away from its section would send a reader out of the section
# they are working through and skip the sibling card they just saw next to it.
# spec/golden/help_spec.rb fails when the two orderings disagree.
